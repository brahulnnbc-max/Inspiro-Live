<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="maskableBgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#09090B"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#maskableBgGlow)"/>

  <!-- Centered inspiro LIVE badge inside safe zone (380x150) -->
  <g transform="translate(0, 0)">
    <rect x="76" y="196" width="360" height="120" rx="28" fill="#0F0F12" stroke="#27272A" stroke-width="3"/>
    
    <!-- Live Pulse Dot -->
    <circle cx="112" cy="256" r="8" fill="#FF0000"/>
    <circle cx="112" cy="256" r="14" fill="none" stroke="#FF0000" stroke-width="2" opacity="0.4"/>

    <!-- inspiro (white) -->
    <text x="138" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">inspiro</text>

    <!-- LIVE (red) -->
    <text x="340" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="#FF0000" letter-spacing="1">LIVE</text>
  </g>
</svg>
