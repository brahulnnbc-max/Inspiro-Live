<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" fill="none">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap");
      .inspiro-txt {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 32px;
        letter-spacing: -0.02em;
        fill: #FFFFFF;
      }
      .live-txt {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 32px;
        letter-spacing: 0.04em;
        fill: #EF4444;
      }
    </style>
  </defs>

  <!-- inspiro in white and LIVE in red -->
  <text x="0" y="30">
    <tspan class="inspiro-txt">inspiro</tspan>
    <tspan dx="8" class="live-txt">LIVE</tspan>
  </text>
</svg>